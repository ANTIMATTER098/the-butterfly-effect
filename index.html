<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Butterfly Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sfondi e Personaggi -->
    <div id="background-image"></div>
    <div id="character-image"></div>

    <div id="game-container">
        <!-- SCHERMATA INIZIALE -->
        <div id="start-screen">
            <h1>🦋 The Butterfly Effect</h1>
            <p>Come ti chiami?</p>
            <input type="text" id="player-name" placeholder="Il tuo nome...">
            <p>Sei...</p>
            <button onclick="startGame('donna')">Donna</button>
            <button onclick="startGame('uomo')">Uomo</button>
        </div>

        <!-- MENU SELEZIONE EPISODIO -->
        <div id="menu-screen" style="display: none;">
            <h2>Da quale episodio vuoi iniziare?</h2>
            <button onclick="startFromEpisode(1)">Episodio 1: L'Abito</button>
            <button onclick="startFromEpisode(2)">Episodio 2: Il Messaggio</button>
            <button onclick="startFromEpisode(3)">Episodio 3: Il Mezzo Perso</button>
            <button onclick="startFromEpisode(4)">Episodio 4: La Telefonata</button>
            <button onclick="startFromEpisode(5)">Episodio 5: L'Oggetto Dimenticato</button>
        </div>

        <!-- AREA DI GIOCO -->
        <div id="game-screen" style="display: none;">
            <div id="text-area"></div>
            <div id="choices-area"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
