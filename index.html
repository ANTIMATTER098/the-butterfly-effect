<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calcio Pallini</title>
  <style>
    body { margin: 0; background: #111; overflow: hidden; font-family: sans-serif; color: #fff; }
    canvas { display: block; margin: 0 auto; background: #2a7a2a; }
    #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; }
    #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; text-align: center; pointer-events: none; }
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #111; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; z-index: 10;
    }
    .screen h1 { margin: 0; }
    .screen label { display: flex; flex-direction: column; gap: 5px; font-size: 16px; }
    .screen select, .screen button, .screen input {
      padding: 8px 12px; font-size: 16px; border-radius: 6px; border: none;
    }
    .screen button {
      background: #2a7a2a; color: #fff; cursor: pointer; font-weight: bold;
      padding: 12px 24px; font-size: 18px;
    }
    .screen button:hover { background: #3a9a3a; }
    .screen .secondary { background: #555; }
    .screen .secondary:hover { background: #777; }
    .msg { color: #aaa; font-size: 14px; min-height: 20px; text-align: center; }
    .code-display { font-size: 32px; font-weight: bold; letter-spacing: 4px; color: #4ade80; }
    .row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Schermata 1: Home -->
  <div id="homeScreen" class="screen">
    <h1>⚽ Calcio Pallini</h1>
    <div class="row">
      <button id="goCreate">Crea una stanza</button>
      <button id="goJoin" class="secondary">Entra in una stanza</button>
    </div>
  </div>

  <!-- Schermata 2: Crea stanza -->
  <div id="createScreen" class="screen hidden">
    <h1>Crea Stanza</h1>
    <label>
      Giocatori per squadra:
      <select id="createMaxPerTeam">
        <option value="1">1 vs 1</option>
        <option value="2" selected>2 vs 2 (max)</option>
      </select>
    </label>
    <label>
      Durata partita:
      <select id="createMatchTime">
        <option value="60">1 minuto</option>
        <option value="180">3 minuti</option>
        <option value="300">5 minuti</option>
        <option value="600" selected>10 minuti</option>
      </select>
    </label>
    <button id="doCreate">Genera Codice Stanza</button>
    <p id="createMsg" class="msg"></p>
    <div id="codeArea" class="hidden">
      <p>Codice stanza (condividilo con i tuoi amici):</p>
      <div id="roomCodeDisplay" class="code-display"></div>
      <p class="msg">In attesa che gli altri entrino...</p>
      <button id="enterCreated" class="hidden">Entra nella partita</button>
    </div>
    <button id="backFromCreate" class="secondary">Indietro</button>
  </div>

  <!-- Schermata 3: Entra in stanza -->
  <div id="joinScreen" class="screen hidden">
    <h1>Entra in una Stanza</h1>
    <label>
      Codice stanza:
      <input id="joinCodeInput" type="text" placeholder="Es. ABCD" maxlength="4" style="text-transform: uppercase; text-align: center; font-size: 20px; letter-spacing: 3px;">
    </label>
    <button id="doJoin">Entra</button>
    <p id="joinMsg" class="msg"></p>
    <button id="backFromJoin" class="secondary">Indietro</button>
  </div>

  <!-- Gioco -->
  <canvas id="c" width="900" height="600" class="hidden"></canvas>
  <div id="hud" class="hidden">
    <div id="score">0 - 0</div>
    <div id="timer">10:00</div>
  </div>
  <div id="msg"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const socket = io();
    const W = 900, H = 600;
    const GOAL_H = 160;

    let myTeam = null;
    let myId = null;
    let myRoomId = null;
    let state = { players: {}, ball: { x: W/2, y: H/2 }, score: { A: 0, B: 0 }, timeLeft: 600, matchState: 'waiting', inExtraTime: false };
    let keys = {};

    // Elementi UI
    const homeScreen = document.getElementById('homeScreen');
    const createScreen = document.getElementById('createScreen');
    const joinScreen = document.getElementById('joinScreen');
    const hud = document.getElementById('hud');
    const createMsg = document.getElementById('createMsg');
    const joinMsg = document.getElementById('joinMsg');
    const codeArea = document.getElementById('codeArea');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const enterCreated = document.getElementById('enterCreated');

    // Navigazione
    document.getElementById('goCreate').onclick = () => {
      homeScreen.classList.add('hidden');
      createScreen.classList.remove('hidden');
    };
    document.getElementById('goJoin').onclick = () => {
      homeScreen.classList.add('hidden');
      joinScreen.classList.remove('hidden');
    };
    document.getElementById('backFromCreate').onclick = () => {
      createScreen.classList.add('hidden');
      homeScreen.classList.remove('hidden');
      codeArea.classList.add('hidden');
      createMsg.textContent = '';
    };
    document.getElementById('backFromJoin').onclick = () => {
      joinScreen.classList.add('hidden');
      homeScreen.classList.remove('hidden');
      joinMsg.textContent = '';
    };

    // Crea stanza
    document.getElementById('doCreate').onclick = () => {
      const maxPerTeam = parseInt(document.getElementById('createMaxPerTeam').value);
      const matchTime = parseInt(document.getElementById('createMatchTime').value);
      socket.emit('createRoom', { maxPerTeam, matchTime });
      createMsg.textContent = 'Generazione in corso...';
    };

    socket.on('roomCreated', (data) => {
      myRoomId = data.roomId;
      roomCodeDisplay.textContent = data.roomId;
      codeArea.classList.remove('hidden');
      createMsg.textContent = '';
      enterCreated.classList.remove('hidden');
    });

    enterCreated.onclick = () => {
      socket.emit('joinGame', { roomId: myRoomId });
      enterCreated.classList.add('hidden');
    };

    // Entra in stanza esistente
    document.getElementById('doJoin').onclick = () => {
      const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
      if (!code) { joinMsg.textContent = 'Inserisci un codice.'; return; }
      myRoomId = code;
      socket.emit('joinGame', { roomId: code });
      joinMsg.textContent = 'Connessione...';
    };

    socket.on('errorMsg', (msg) => {
      joinMsg.textContent = msg;
      createMsg.textContent = msg;
    });
    socket.on('full', () => {
      joinMsg.textContent = 'Stanza piena.';
      createMsg.textContent = 'Stanza piena.';
    });

    // Assegnazione squadra e avvio
    socket.on('assigned', (data) => {
      myTeam = data.team;
      myId = data.playerId;
      homeScreen.classList.add('hidden');
      createScreen.classList.add('hidden');
      joinScreen.classList.add('hidden');
      canvas.classList.remove('hidden');
      hud.classList.remove('hidden');
    });

    socket.on('matchStart', () => {
      document.getElementById('msg').textContent = '';
    });

    socket.on('goal', (data) => {
      document.getElementById('msg').textContent = `GOL! ${data.team} segna!`;
      setTimeout(() => { if (document.getElementById('msg').textContent.startsWith('GOL')) document.getElementById('msg').textContent = ''; }, 1500);
    });
    socket.on('extraTime', () => {
      document.getElementById('msg').textContent = 'Pareggio! Supplementare!';
      setTimeout(() => document.getElementById('msg').textContent = '', 2000);
    });
    socket.on('matchEnd', (data) => {
      document.getElementById('msg').textContent = data.winner === 'pareggio' ? 'Pareggio!' : `Vince ${data.winner}!`;
    });
    socket.on('state', (s) => { state = s; });

    // Input
    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ') { socket.emit('boost'); e.preventDefault(); }
    });
    document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Loop di gioco
    function loop() {
      if (myTeam) {
        let dx = 0, dy = 0;
        if (keys['w']) dy -= 1;
        if (keys['s']) dy += 1;
        if (keys['a']) dx -= 1;
        if (keys['d']) dx += 1;
        if (dx !== 0 || dy !== 0) { const len = Math.hypot(dx, dy); dx /= len; dy /= len; }
        socket.emit('move', { dx, dy });
      }

      ctx.clearRect(0, 0, W, H);
      drawField();
      drawBall();
      drawPlayers();
      drawHUD();
      requestAnimationFrame(loop);
    }

    function drawField() {
      ctx.fillStyle = '#2a7a2a';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, W, H);
      ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
      ctx.beginPath(); ctx.arc(W/2, H/2, 80, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(0, H/2 - GOAL_H/2, 8, GOAL_H);
      ctx.fillRect(W - 8, H/2 - GOAL_H/2, 8, GOAL_H);
    }

    function drawBall() {
      const b = state.ball;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    }

    function drawPlayers() {
      for (const id in state.players) {
        const p = state.players[id];
        ctx.fillStyle = p.team === 'A' ? '#e63946' : '#457b9d';
        ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();
        if (id === myId) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
      }
    }

    function drawHUD() {
      document.getElementById('score').textContent = `${state.score.A} - ${state.score.B}`;
      const t = Math.max(0, Math.ceil(state.timeLeft));
      const m = Math.floor(t / 60);
      const s = t % 60;
      document.getElementById('timer').textContent =
        `${m}:${s.toString().padStart(2, '0')}` + (state.inExtraTime ? ' (supp.)' : '');
    }

    loop();
  </script>
</body>
</html>
